[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revit-model-mcp"
version = "0.6.0"
description = "MCP access to live Autodesk Revit models, read-only by default with opt-in actions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["revit", "bim", "mcp", "mcp-server", "autodesk", "claude"]
authors = [{name = "Dinar Sharafutdinov"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = ["mcp>=2.0.0"]

[project.urls]
Homepage = "https://github.com/sharafutdinovdi/revit-model-mcp"
Changelog = "https://github.com/sharafutdinovdi/revit-model-mcp/blob/main/CHANGELOG.md"
Repository = "https://github.com/sharafutdinovdi/revit-model-mcp"
Documentation = "https://github.com/sharafutdinovdi/revit-model-mcp#readme"
Issues = "https://github.com/sharafutdinovdi/revit-model-mcp/issues"

[project.scripts]
revit-model-mcp = "revit_model_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["revit_model_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.16.7"
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
