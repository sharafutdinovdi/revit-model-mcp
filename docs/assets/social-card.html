<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revit Model MCP social card</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Roboto Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    #card {
      width: 1280px;
      height: 640px;
      background: #005FB8;
      position: relative;
      overflow: hidden;
    }

    #card > svg {
      position: absolute;
      left: 120px;
      top: 160px;
      width: 320px;
      height: 320px;
    }

    .text {
      position: absolute;
      left: 520px;
      top: 50%;
      transform: translateY(-50%);
      max-width: 640px;
    }

    h1 {
      margin: 0;
      font-size: 72px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.1;
    }

    .subtitle {
      margin: 24px 0 0;
      font-size: 30px;
      font-weight: 400;
      color: #DCE8F5;
    }

    .footer {
      margin: 40px 0 0;
      font-size: 22px;
      font-weight: 400;
      color: #9FC3EA;
    }
  </style>
</head>
<body>
  <div id="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
      <title>Revit Model MCP</title>
      <rect x="8" y="14" width="28" height="6" rx="2" fill="#FFFFFF"/>
      <rect x="8" y="29" width="28" height="6" rx="2" fill="#FFFFFF"/>
      <rect x="8" y="44" width="28" height="6" rx="2" fill="#FFFFFF"/>
      <path d="M 49.7 24.6 A 10 10 0 0 1 49.7 39.4 M 54.4 19.4 A 17 17 0 0 1 54.4 44.6" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <circle cx="43" cy="32" r="3.5" fill="#FFFFFF"/>
    </svg>
    <div class="text">
      <h1>Revit Model MCP</h1>
      <p class="subtitle">Read-only MCP server for live Autodesk Revit models</p>
      <p class="footer">github.com/sharafutdinovdi/revit-model-mcp</p>
    </div>
  </div>
</body>
</html>
