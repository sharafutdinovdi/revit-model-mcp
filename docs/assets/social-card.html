<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revit Model MCP social card</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Roboto Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    #card {
      width: 1280px;
      height: 640px;
      background: #005FB8;
      position: relative;
      overflow: hidden;
    }

    #card > svg {
      position: absolute;
      left: 120px;
      top: 160px;
      width: 320px;
      height: 320px;
    }

    .text {
      position: absolute;
      left: 520px;
      top: 50%;
      transform: translateY(-50%);
      max-width: 640px;
    }

    h1 {
      margin: 0;
      font-size: 72px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.1;
    }

    .subtitle {
      margin: 24px 0 0;
      font-size: 30px;
      font-weight: 400;
      color: #DCE8F5;
    }

    .footer {
      margin: 40px 0 0;
      font-size: 22px;
      font-weight: 400;
      color: #9FC3EA;
    }
  </style>
</head>
<body>
  <div id="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
      <title>Revit Model MCP</title>
      <polygon points="32,34 56,46 32,58 8,46" fill="#FFFFFF"/>
      <polygon points="8,46 32,58 32,63 8,51" fill="#A9C9EA"/>
      <polygon points="32,58 56,46 56,51 32,63" fill="#A9C9EA"/>
      <polygon points="32,20 56,32 32,44 8,32" fill="#FFFFFF"/>
      <polygon points="8,32 32,44 32,49 8,37" fill="#A9C9EA"/>
      <polygon points="32,44 56,32 56,37 32,49" fill="#A9C9EA"/>
      <polygon points="32,6 56,18 32,30 8,18" fill="#FFFFFF"/>
      <polygon points="8,18 32,30 32,35 8,23" fill="#A9C9EA"/>
      <polygon points="32,30 56,18 56,23 32,35" fill="#A9C9EA"/>
    </svg>
    <div class="text">
      <h1>Revit Model MCP</h1>
      <p class="subtitle">Autodesk Revit models over MCP.<br>Read by default, act on opt-in.</p>
      <p class="footer">github.com/sharafutdinovdi/revit-model-mcp</p>
    </div>
  </div>
</body>
</html>
