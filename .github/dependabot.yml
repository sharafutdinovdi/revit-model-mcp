version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/RevitModelMcp.Addin
      - /src/RevitModelMcp.Core
      - /tests/RevitModelMcp.Core.Tests
      - /build
      - /build/install
    schedule:
      interval: weekly
    labels: [dependencies, build]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    labels: [dependencies, server]
    commit-message:
      prefix: chore(deps)
