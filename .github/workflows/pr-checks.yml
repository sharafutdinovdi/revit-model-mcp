name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ci.yml

  quality:
    name: pr-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Conventional Commit title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check workflows with actionlint
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_windows_amd64.zip --dir "$env:RUNNER_TEMP/actionlint"
          if ($LASTEXITCODE -ne 0) { throw 'actionlint download failed' }
          Expand-Archive "$env:RUNNER_TEMP/actionlint/actionlint_1.7.12_windows_amd64.zip" "$env:RUNNER_TEMP/actionlint/bin"
          & "$env:RUNNER_TEMP/actionlint/bin/actionlint.exe"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify C# formatting
        env:
          Configuration: Debug.R26
          DeployAddin: 'false'
        run: dotnet format RevitModelMcp.sln --verify-no-changes --verbosity minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict
      - name: Install Ruff
        run: pip install ruff==0.16.7
      - name: Check Python
        working-directory: server
        run: ruff check .
      - name: Verify Python formatting
        working-directory: server
        run: ruff format --check .
