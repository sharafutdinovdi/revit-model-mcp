name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  quality:
    name: pr-checks
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Check Conventional Commit title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check workflows with actionlint
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_windows_amd64.zip --dir "$env:RUNNER_TEMP/actionlint"
          if ($LASTEXITCODE -ne 0) { throw 'actionlint download failed' }
          Expand-Archive "$env:RUNNER_TEMP/actionlint/actionlint_1.7.12_windows_amd64.zip" "$env:RUNNER_TEMP/actionlint/bin"
          & "$env:RUNNER_TEMP/actionlint/bin/actionlint.exe"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify C# formatting
        env:
          Configuration: Debug.R26
          DeployAddin: 'false'
        run: dotnet format RevitModelMcp.sln --verify-no-changes --verbosity minimal
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict
      - name: Install Ruff
        run: pip install ruff==0.16.7
      - name: Check Python
        working-directory: server
        run: ruff check .
      - name: Verify Python formatting
        working-directory: server
        run: ruff format --check .

  explain-failure:
    needs: [ci, quality]
    if: >-
      failure() && github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      actions: read
      pull-requests: write
    uses: sharafutdinovdi/.github/.github/workflows/check-failure-comment.yml@main
    with:
      step-commands: >-
        {
          "Check Conventional Commit title": "use a Conventional Commit PR title, e.g. fix(server): ...",
          "Check workflows with actionlint": "actionlint",
          "Verify C# formatting": "$env:Configuration = 'Debug.R26'; $env:DeployAddin = 'false'; dotnet format RevitModelMcp.sln --verify-no-changes --verbosity minimal",
          "Install documentation dependencies": "pip install -r docs/requirements.txt",
          "Build documentation": "mkdocs build --strict",
          "Install Ruff": "pip install ruff==0.16.7",
          "Check Python": "cd server; uvx ruff==0.16.7 check .",
          "Verify Python formatting": "cd server; uvx ruff==0.16.7 format --check ."
        }
    secrets: inherit
