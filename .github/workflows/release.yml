name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Expected a v<semver> tag' }
          $packageVersion = python -c "import tomllib; print(tomllib.load(open('server/pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or $packageVersion -ne $version) { throw 'Tag and Python package versions must match' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test core
        run: dotnet test --project tests/RevitModelMcp.Core.Tests/RevitModelMcp.Core.Tests.csproj
      - name: Test server
        working-directory: server
        run: uv run --with pytest pytest -q
      - name: Build and zip Revit 2022-2027
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          foreach ($year in '22', '23', '24', '25', '26', '27') {
            dotnet build src/RevitModelMcp.Addin -c "Release.R$year" -p:DeployAddin=false "-p:Version=$env:RELEASE_VERSION"
            if ($LASTEXITCODE -ne 0) { throw "R$year build failed" }
            $stage = "artifacts/addin-R$year"
            New-Item -ItemType Directory -Force "$stage/RevitModelMcp" | Out-Null
            Copy-Item "src/RevitModelMcp.Addin/bin/Release.R$year/*" "$stage/RevitModelMcp" -Recurse
            Copy-Item src/RevitModelMcp.Addin/RevitModelMcp.addin, LICENSE, THIRD-PARTY-NOTICES.md $stage
            if (!(Test-Path "$stage/RevitModelMcp/RevitModelMcp.dll")) { throw "Missing R$year add-in" }
            if (Get-ChildItem $stage -Recurse -Filter 'RevitAPI*.dll') { throw 'Revit API binaries must not be distributed' }
            Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/release/revit-model-mcp-addin-$env:RELEASE_VERSION-R$year.zip"
          }
      - name: Build installers
        shell: pwsh
        env:
          Build__Version: ${{ env.RELEASE_VERSION }}
        run: |
          dotnet run --project build -- pack --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $installers = @(Get-ChildItem output/*.msi)
          if ($installers.Count -ne 2) { throw "Expected two MSIs, found $($installers.Count)" }
          $installers | ForEach-Object { Write-Host "MSI: $($_.Name) ($($_.Length) bytes)" }
      - name: Verify MSI contents
        shell: pwsh
        run: |
          foreach ($msi in Get-ChildItem output/*.msi) {
            $target = Join-Path $env:RUNNER_TEMP "extract-$($msi.BaseName)"
            $log = Join-Path $env:RUNNER_TEMP "$($msi.BaseName)-extract.log"
            $process = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn /norestart TARGETDIR=`"$target`" /l*v `"$log`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "MSI extraction failed: $($process.ExitCode)" }
            $files = @(Get-ChildItem $target -Recurse -File)
            if ($files | Where-Object Name -Like 'RevitAPI*.dll') { throw 'Revit API binaries must not be distributed' }
            $manifests = @($files | Where-Object Name -EQ 'RevitModelMcp.addin')
            if ($manifests.Count -ne 6) { throw 'Unexpected Revit year count in MSI' }
            foreach ($year in '22', '23', '24', '25', '26', '27') {
              $manifest = @($manifests | Where-Object { $_.Directory.Name -eq "20$year" })
              if ($manifest.Count -ne 1) { throw "Missing or duplicate R$year manifest in MSI" }
              if (!(Test-Path "$($manifest[0].DirectoryName)/RevitModelMcp/RevitModelMcp.dll")) { throw "Missing R$year assembly in MSI" }
              Write-Host "ASSERT: $($msi.Name) contains R$year manifest and assembly"
            }
            Write-Host "ASSERT: $($msi.Name) contains no RevitAPI DLLs"
          }
      - name: Upload MSI logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs
          path: |
            ${{ runner.temp }}/mcp-*.log
            ${{ runner.temp }}/*-extract.log
      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: output/*.msi
          if-no-files-found: error
      - name: Validate package
        shell: pwsh
        run: |
          uv build server
          if ($LASTEXITCODE -ne 0) { throw 'Python build failed' }
          uvx twine check server/dist/*
          if ($LASTEXITCODE -ne 0) { throw 'Package validation failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: server/dist/*
          if-no-files-found: error
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Set bundle release version
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          import json
          import os
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          path = Path('bundle/manifest.json')
          manifest = json.loads(path.read_text())
          manifest['version'] = version
          package = f'revit-model-mcp=={version}'
          # Prereleases are distributed as wheels on GitHub, without PyPI publishing.
          if '-' in version:
              wheel, = Path('server/dist').glob('*.whl')
              package = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{os.environ["RELEASE_TAG"]}/{wheel.name}'
          manifest['server']['mcp_config']['args'][1] = package
          path.write_text(json.dumps(manifest, indent=2) + '\n')
      - name: Validate and pack Claude Desktop bundle
        shell: pwsh
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate bundle/manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Bundle validation failed' }
          npx --yes @anthropic-ai/mcpb@2.1.2 pack bundle "artifacts/release/revit-model-mcp-$env:RELEASE_VERSION.mcpb"
          if ($LASTEXITCODE -ne 0) { throw 'Bundle packing failed' }
      - name: Stage release assets and checksums
        shell: pwsh
        run: |
          Copy-Item output/*.msi, server/dist/*.whl, server/dist/*.tar.gz artifacts/release/
          $expected = @{ '*.zip' = 6; '*.msi' = 2; '*.whl' = 1; '*.tar.gz' = 1; '*.mcpb' = 1 }
          foreach ($pattern in $expected.Keys) {
            $count = @(Get-ChildItem "artifacts/release/$pattern").Count
            if ($count -ne $expected[$pattern]) { throw "Unexpected $pattern count: $count" }
            Write-Host "ASSERT: $pattern count = $count"
          }
          Get-ChildItem artifacts/release -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content artifacts/release/SHA256SUMS.txt -Encoding utf8
      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/release/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: artifacts/release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: artifacts/release
      - name: Compose install notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          base="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG"
          wheels=(artifacts/release/*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo 'Expected exactly one Python wheel' >&2
            exit 1
          fi
          wheel="${wheels[0]##*/}"
          {
            echo '## Install'
            echo
            echo "- Claude Desktop: [download the .mcpb and open it]($base/revit-model-mcp-$version.mcpb). Requires uv on the client PATH and the add-in on the Windows workstation."
            echo "- [Single-user MSI]($base/RevitModelMcp-$version-SingleUser.msi): current Windows account."
            echo "- [Multi-user MSI]($base/RevitModelMcp-$version-MultiUser.msi): all users."
            printf '%s' '- Per-year ZIPs:'
            for year in 22 23 24 25 26 27; do
              printf ' [R%s](%s/revit-model-mcp-addin-%s-R%s.zip)' "$year" "$base" "$version" "$year"
            done
            echo
            echo "- [Python wheel]($base/$wheel)"
            echo "- [SHA256SUMS.txt]($base/SHA256SUMS.txt) covers every release asset."
            echo
            echo 'Close Revit before installing, then start Revit and open a model.'
            echo 'On the MCP client, run the published Python package:'
            echo
            echo '```sh'
            echo 'uvx revit-model-mcp'
            echo '```'
            echo
            echo 'Prereleases are not published to PyPI; install the wheel above instead.'
          } > install-notes.md
          cat install-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
            gh release view "$RELEASE_TAG" --json body --jq '.body' > release-notes.md
            python - <<'PYTHON'
          from pathlib import Path
          import re

          path = Path('release-notes.md')
          body = path.read_text()
          # Replace only the managed section on retries; preserve all other release notes.
          body = re.sub(r'^## Install\n.*?(?=^## |\Z)', '', body, flags=re.MULTILINE | re.DOTALL)
          install = Path('install-notes.md').read_text()
          path.write_text(body.rstrip() + '\n\n' + install)
          PYTHON
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md "${options[@]}"
          else
            gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --notes-file install-notes.md --generate-notes "${options[@]}"
          fi


  # PyPI pending publisher:
  # Project: revit-model-mcp
  # Owner: sharafutdinovdi
  # Repository: revit-model-mcp
  # Workflow: release.yml
  # Environment: pypi
  # Prerelease tags skip PyPI and MCP Registry publishing.
  pypi:
    needs: build
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Set registry package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path('server/pyproject.toml').read_text())['project']['version']
          assert version == os.environ['RELEASE_TAG'][1:], 'Tag and package version differ'
          path = pathlib.Path('server/server.json')
          manifest = json.loads(path.read_text())
          manifest['version'] = version
          manifest['packages'][0]['version'] = version
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON
      - name: Install mcp-publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api repos/modelcontextprotocol/registry/releases/latest)
          tag=$(jq -r .tag_name <<< "$release")
          archive=mcp-publisher_linux_amd64.tar.gz
          gh release download "$tag" --repo modelcontextprotocol/registry --pattern "$archive"
          checksums=$(jq -r '.assets[].name | select(endswith("_checksums.txt"))' <<< "$release")
          if [[ -n "$checksums" ]]; then
            gh release download "$tag" --repo modelcontextprotocol/registry --pattern "$checksums"
            awk -v archive="$archive" '$2 == archive { print }' "$checksums" > publisher.sha256
            test -s publisher.sha256
            sha256sum --check publisher.sha256
          else
            echo "Release $tag provides no checksum file"
          fi
          tar -xzf "$archive" mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server/server.json 2>&1 | tee mcp-publish-response.txt

  # Releases created with GITHUB_TOKEN do not trigger release workflows.
  winget:
    needs: publish
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    uses: ./.github/workflows/winget.yml
    with:
      release_tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
