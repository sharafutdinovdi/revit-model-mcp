name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Require dispatch on the requested tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != tag || "$RELEASE_TAG" != "$REF_NAME" ]]; then
            echo 'Dispatch release.yml with --ref set to the same tag as the tag input.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install --require-hashes -r .github/requirements/uv.txt
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Expected a v<semver> tag' }
          $packageVersion = python -c "import tomllib; print(tomllib.load(open('server/pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or $packageVersion -ne $version) { throw 'Tag and Python package versions must match' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore tests with lock
        run: dotnet restore tests/RevitModelMcp.Core.Tests/RevitModelMcp.Core.Tests.csproj --locked-mode
      - name: Test core
        run: dotnet test --project tests/RevitModelMcp.Core.Tests/RevitModelMcp.Core.Tests.csproj --no-restore
      - name: Test server
        working-directory: server
        run: |
          uv sync --frozen
          uv run --frozen --with pytest==9.1.1 pytest -q
      - name: Restore Revit API reference pin helper with lock
        run: dotnet restore build/RevitApiReferencePin/RevitApiReferencePin.csproj --locked-mode -p:Configuration=Release
      - name: Build and zip Revit 2022-2027
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          foreach ($year in '22', '23', '24', '25', '26', '27') {
            dotnet restore src/RevitModelMcp.Addin/RevitModelMcp.Addin.csproj --locked-mode "-p:Configuration=Release.R$year" -p:DeployAddin=false "-p:Version=$env:RELEASE_VERSION"
            if ($LASTEXITCODE -ne 0) { throw "R$year locked restore failed" }
            dotnet build src/RevitModelMcp.Addin -c "Release.R$year" -p:DeployAddin=false "-p:Version=$env:RELEASE_VERSION" --no-restore
            if ($LASTEXITCODE -ne 0) { throw "R$year build failed" }
            $assembly = "src/RevitModelMcp.Addin/bin/Release.R$year/RevitModelMcp.dll"
            $assemblyVersion = [System.Reflection.AssemblyName]::GetAssemblyName($assembly).Version.ToString(3)
            $expectedVersion = $env:RELEASE_VERSION.Split('-')[0]
            if ($assemblyVersion -ne $expectedVersion) { throw "R$year assembly version $assemblyVersion differs from $expectedVersion" }
            $stage = "artifacts/addin-R$year"
            New-Item -ItemType Directory -Force "$stage/RevitModelMcp" | Out-Null
            Get-ChildItem "src/RevitModelMcp.Addin/bin/Release.R$year" |
              Where-Object Name -ne 'publish' | Copy-Item -Destination "$stage/RevitModelMcp" -Recurse
            Copy-Item "src/RevitModelMcp.Addin/bin/Release.R$year/publish/RevitModelMcp.addin", LICENSE, THIRD-PARTY-NOTICES.md $stage
            if (!(Test-Path "$stage/RevitModelMcp/RevitModelMcp.dll")) { throw "Missing R$year add-in" }
            if (!(Test-Path "$stage/RevitModelMcp/RevitModelMcp.Updater.exe")) { throw "Missing R$year updater" }
            $blocked = @(Get-ChildItem $stage -Recurse -Filter '*.dll' -File | Where-Object {
              $_.Name -match '^(AdWindows|UIFramework|RevitAPI|RevitNET).*\.dll$' -or
              $_.VersionInfo.CompanyName -match 'Autodesk'
            })
            if ($blocked.Count) { throw "Autodesk binaries must not be distributed: $($blocked.Name -join ', ')" }
            Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/release/revit-model-mcp-addin-$env:RELEASE_VERSION-R$year.zip"
          }
      - name: Restore build and installer projects with locks
        shell: pwsh
        run: |
          dotnet restore build/Build.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Build project locked restore failed' }
          dotnet restore build/install/Installer.csproj --locked-mode -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw 'Installer locked restore failed' }
      - name: Build installers
        shell: pwsh
        env:
          Build__Version: ${{ env.RELEASE_VERSION }}
        run: |
          dotnet run --no-restore --project build -- pack --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $installers = @(Get-ChildItem output/*.msi)
          if ($installers.Count -ne 2) { throw "Expected two MSIs, found $($installers.Count)" }
          $installers | ForEach-Object { Write-Host "MSI: $($_.Name) ($($_.Length) bytes)" }
      - name: Verify MSI contents
        shell: pwsh
        run: |
          foreach ($msi in Get-ChildItem output/*.msi) {
            $target = Join-Path $env:RUNNER_TEMP "extract-$($msi.BaseName)"
            $log = Join-Path $env:RUNNER_TEMP "$($msi.BaseName)-extract.log"
            $process = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn /norestart TARGETDIR=`"$target`" /l*v `"$log`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "MSI extraction failed: $($process.ExitCode)" }
            $files = @(Get-ChildItem $target -Recurse -File)
            $blocked = @($files | Where-Object {
              $_.Name -match '^(AdWindows|UIFramework|RevitAPI|RevitNET).*\.dll$' -or
              ($_.Extension -eq '.dll' -and $_.VersionInfo.CompanyName -match 'Autodesk')
            })
            if ($blocked.Count) { throw "Autodesk binaries must not be distributed: $($blocked.Name -join ', ')" }
            $manifests = @($files | Where-Object Name -EQ 'RevitModelMcp.addin')
            if ($manifests.Count -ne 6) { throw 'Unexpected Revit year count in MSI' }
            foreach ($year in '22', '23', '24', '25', '26', '27') {
              $manifest = @($manifests | Where-Object { $_.Directory.Name -eq "20$year" })
              if ($manifest.Count -ne 1) { throw "Missing or duplicate R$year manifest in MSI" }
              [xml]$manifestXml = Get-Content -LiteralPath $manifest[0].FullName
              if (($year -in '26', '27') -ne ($null -ne $manifestXml.SelectSingleNode('/RevitAddIns/ManifestSettings'))) {
                throw "Wrong ManifestSettings in R$year MSI manifest"
              }
              if (!(Test-Path "$($manifest[0].DirectoryName)/RevitModelMcp/RevitModelMcp.dll")) { throw "Missing R$year assembly in MSI" }
              if (!(Test-Path "$($manifest[0].DirectoryName)/RevitModelMcp/RevitModelMcp.Updater.exe")) { throw "Missing R$year updater in MSI" }
              Write-Host "ASSERT: $($msi.Name) contains R$year manifest and assembly"
            }
            Write-Host "ASSERT: $($msi.Name) contains no Autodesk DLLs"
          }
      - name: Build and validate the managed Revit bundle
        shell: pwsh
        env:
          Build__Version: ${{ env.RELEASE_VERSION }}
          Bundle__Managed: 'true'
        run: |
          foreach ($year in '22', '23', '24', '25', '26', '27') {
            dotnet restore src/RevitModelMcp.Addin/RevitModelMcp.Addin.csproj --locked-mode "-p:Configuration=Release.R$year" -p:DeployAddin=false "-p:Version=$env:RELEASE_VERSION"
            if ($LASTEXITCODE -ne 0) { throw "R$year locked restore failed" }
            dotnet build src/RevitModelMcp.Addin -c "Release.R$year" -p:DeployAddin=false "-p:Version=$env:RELEASE_VERSION" -p:ManagedInstall=true --no-restore
            if ($LASTEXITCODE -ne 0) { throw "R$year managed build failed" }
            $bytes = [IO.File]::ReadAllBytes("src/RevitModelMcp.Addin/bin/Release.R$year/RevitModelMcp.dll")
            $text = [Text.Encoding]::Latin1.GetString($bytes)
            if ($text -notmatch 'ManagedInstall.true') { throw "R$year managed build does not carry ManagedInstall=true" }
          }
          dotnet run --no-restore --project build -- bundle
          if ($LASTEXITCODE -ne 0) { throw 'Managed bundle build failed' }
          $bundle = "output/revit-model-mcp-$env:RELEASE_VERSION-managed.bundle.zip"
          python build/validate_bundle.py $bundle --years 2022-2027 --managed-version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Managed bundle validation failed' }
          Copy-Item $bundle artifacts/release/
      - name: Check SignPath configuration
        id: signpath
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [[ -n "$SIGNPATH_API_TOKEN" && -n "$SIGNPATH_ORGANIZATION_ID" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::SignPath is not configured (SIGNPATH_API_TOKEN secret or SIGNPATH_ORGANIZATION_ID variable is empty); release assets stay unsigned.'
          fi
      - name: Stage unsigned artifacts for SignPath
        id: signing-input
        if: ${{ steps.signpath.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $stage = 'signing/unsigned'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item output/*.msi, artifacts/release/*.zip $stage
          $names = @(Get-ChildItem $stage -File).Name
          $zips = @($names | Where-Object { $_ -like '*.zip' })
          $msis = @($names | Where-Object { $_ -like '*.msi' })
          if ($msis.Count -ne 2 -or $zips.Count -ne 7) { throw "Expected 2 MSIs and 7 ZIPs to sign, found $($msis.Count) and $($zips.Count)" }
          # The artifact configuration enforces these values, so fail here with a readable message.
          $productVersion = (Get-Item 'src/RevitModelMcp.Addin/bin/Release.R27/RevitModelMcp.dll').VersionInfo.ProductVersion
          foreach ($year in '22', '23', '24', '25', '26', '27') {
            foreach ($name in 'RevitModelMcp.dll', 'RevitModelMcp.Core.dll', 'RevitModelMcp.Updater.exe', 'RevitModelMcp.BatchSupervisor.exe') {
              $info = (Get-Item "artifacts/addin-R$year/RevitModelMcp/$name").VersionInfo
              if ($info.ProductName -ne 'Model MCP') { throw "R$year $name has product name '$($info.ProductName)'" }
              if ($info.ProductVersion -ne $productVersion) { throw "R$year $name has product version '$($info.ProductVersion)', expected '$productVersion'" }
            }
          }
          "PRODUCT_VERSION=$productVersion" >> $env:GITHUB_ENV
      - name: Upload unsigned artifacts
        id: upload-unsigned
        if: ${{ steps.signpath.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-for-signing
          path: signing/unsigned/*
          if-no-files-found: error
      - name: Sign with SignPath
        if: ${{ steps.signpath.outputs.enabled == 'true' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'revit-model-mcp' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'release' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 5400
          output-artifact-directory: signing/signed
          parameters: |
            version: ${{ toJSON(env.RELEASE_VERSION) }}
            product-version: ${{ toJSON(env.PRODUCT_VERSION) }}
      - name: Replace unsigned assets with signed assets
        if: ${{ steps.signpath.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $unsigned = @(Get-ChildItem signing/unsigned -File | Sort-Object Name)
          $signed = @(Get-ChildItem signing/signed -File | Sort-Object Name)
          if (($unsigned.Name -join '|') -ne ($signed.Name -join '|')) {
            throw "Signed files differ from submitted files. Submitted: $($unsigned.Name -join ', '). Signed: $($signed.Name -join ', ')"
          }
          Copy-Item signing/signed/*.msi output/ -Force
          Copy-Item signing/signed/*.zip artifacts/release/ -Force
          Copy-Item "signing/signed/revit-model-mcp-$env:RELEASE_VERSION-managed.bundle.zip" output/ -Force
      - name: Verify signatures
        if: ${{ steps.signpath.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $names = 'RevitModelMcp.dll', 'RevitModelMcp.Core.dll', 'RevitModelMcp.Updater.exe', 'RevitModelMcp.BatchSupervisor.exe'
          function Assert-Signed($file) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) signature status is $($signature.Status)" }
            Write-Host "ASSERT: $($file.Name) is signed by $($signature.SignerCertificate.Subject)"
          }
          function Assert-OwnBinariesSigned($root, $label) {
            $files = @(Get-ChildItem $root -Recurse -File | Where-Object { $names -contains $_.Name })
            if (!$files.Count) { throw "$label contains none of the add-in binaries" }
            foreach ($file in $files) { Assert-Signed $file }
          }
          foreach ($msi in Get-ChildItem output/*.msi) {
            Assert-Signed $msi
            $target = Join-Path $env:RUNNER_TEMP "signed-$($msi.BaseName)"
            $process = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn /norestart TARGETDIR=`"$target`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "MSI extraction failed: $($process.ExitCode)" }
            Assert-OwnBinariesSigned $target $msi.Name
          }
          foreach ($zip in Get-ChildItem artifacts/release/*.zip) {
            $target = Join-Path $env:RUNNER_TEMP "signed-$($zip.BaseName)"
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $target
            Assert-OwnBinariesSigned $target $zip.Name
          }
      - name: Validate signed managed bundle
        if: ${{ steps.signpath.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          python build/validate_bundle.py "output/revit-model-mcp-$env:RELEASE_VERSION-managed.bundle.zip" --years 2022-2027 --managed-version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Signed managed bundle validation failed' }
      - name: Upload MSI logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-logs
          path: |
            ${{ runner.temp }}/mcp-*.log
            ${{ runner.temp }}/*-extract.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers
          path: output/*.msi
          if-no-files-found: error
      - name: Validate package
        shell: pwsh
        run: |
          uv build server
          if ($LASTEXITCODE -ne 0) { throw 'Python build failed' }
          uvx twine==7.0.0 check server/dist/*
          if ($LASTEXITCODE -ne 0) { throw 'Package validation failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: server/dist/*
          if-no-files-found: error
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Set bundle release version
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          import json
          import os
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          path = Path('bundle/manifest.json')
          manifest = json.loads(path.read_text())
          manifest['version'] = version
          config = manifest['server']['mcp_config']
          if '-' in version:
              wheel, = Path('server/dist').glob('*.whl')
              package = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{os.environ["RELEASE_TAG"]}/{wheel.name}'
              launcher = f'uvx --from {package} revit-model-mcp'
              win32_launcher = launcher
          else:
              package = f'"revit-model-mcp>={version}"'
              launcher = f'uvx --offline --prerelease=disallow {package} || uvx --prerelease=disallow {package}'
              win32_package = f'revit-model-mcp^>={version}'
              win32_launcher = f'uvx --offline --prerelease=disallow {win32_package} || uvx --prerelease=disallow {win32_package}'
          config['args'] = ['-c', launcher]
          config['platform_overrides']['win32']['args'] = ['/c', win32_launcher]
          path.write_text(json.dumps(manifest, indent=2) + '\n')
      - name: Validate and pack Claude Desktop bundle
        shell: pwsh
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate bundle/manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Bundle validation failed' }
          npx --yes @anthropic-ai/mcpb@2.1.2 pack bundle "artifacts/release/revit-model-mcp-$env:RELEASE_VERSION.mcpb"
          if ($LASTEXITCODE -ne 0) { throw 'Bundle packing failed' }
      - name: Stage release assets and checksums
        shell: pwsh
        run: |
          Copy-Item output/*.msi, server/dist/*.whl, server/dist/*.tar.gz artifacts/release/
          $expected = @{ '*.zip' = 7; '*.msi' = 2; '*.whl' = 1; '*.tar.gz' = 1; '*.mcpb' = 1 }
          foreach ($pattern in $expected.Keys) {
            $count = @(Get-ChildItem "artifacts/release/$pattern").Count
            if ($count -ne $expected[$pattern]) { throw "Unexpected $pattern count: $count" }
            Write-Host "ASSERT: $pattern count = $count"
          }
          $lines = Get-ChildItem artifacts/release -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          # LF line endings and no BOM, so shasum -c works on macOS and Linux.
          $sums = Join-Path $PWD 'artifacts/release/SHA256SUMS.txt'
          [IO.File]::WriteAllText($sums, (($lines -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
          if ([IO.File]::ReadAllText($sums).Contains("`r")) { throw 'SHA256SUMS.txt contains CR characters.' }
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/release/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: artifacts/release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: artifacts/release
      - name: Compose install notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          base="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG"
          wheels=(artifacts/release/*.whl)
          if [[ ${#wheels[@]} -ne 1 || ! -f "${wheels[0]}" ]]; then
            echo 'Expected exactly one Python wheel' >&2
            exit 1
          fi
          wheel="${wheels[0]##*/}"
          {
            echo '## Install'
            echo
            echo "- Claude Desktop: [download the .mcpb and open it]($base/revit-model-mcp-$version.mcpb). Requires uv on the client PATH and the add-in on the Windows workstation."
            echo "- [Single-user MSI]($base/RevitModelMcp-$version-SingleUser.msi): current Windows account."
            echo "- [Multi-user MSI]($base/RevitModelMcp-$version-MultiUser.msi): all users."
            printf '%s' '- Per-year ZIPs:'
            for year in 22 23 24 25 26 27; do
              printf ' [R%s](%s/revit-model-mcp-addin-%s-R%s.zip)' "$year" "$base" "$version" "$year"
            done
            echo
            echo "- [Python wheel]($base/$wheel)"
            echo "- [SHA256SUMS.txt]($base/SHA256SUMS.txt) covers every release asset."
            echo "- [Code signing](https://sharafutdinovdi.github.io/revit-model-mcp/code-signing/)"
            echo
            echo 'Close Revit before installing, then start Revit and open a model.'
            echo 'On the MCP client, run the published Python package:'
            echo
            echo '```sh'
            echo 'uvx revit-model-mcp'
            echo '```'
            echo
            echo 'Prereleases are not published to PyPI; install the wheel above instead.'
          } > install-notes.md
          cat install-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
            gh release view "$RELEASE_TAG" --json body --jq '.body' > release-notes.md
            python - <<'PYTHON'
          from pathlib import Path
          import re

          path = Path('release-notes.md')
          body = path.read_text()
          # Replace only the managed section on retries; preserve all other release notes.
          body = re.sub(r'^## Install\n.*?(?=^## |\Z)', '', body, flags=re.MULTILINE | re.DOTALL)
          install = Path('install-notes.md').read_text()
          path.write_text(body.rstrip() + '\n\n' + install)
          PYTHON
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md "${options[@]}"
          else
            gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --notes-file install-notes.md --generate-notes "${options[@]}"
          fi


  # PyPI pending publisher:
  # Project: revit-model-mcp
  # Owner: sharafutdinovdi
  # Repository: revit-model-mcp
  # Workflow: release.yml
  # Environment: pypi
  # Prerelease tags skip PyPI and MCP Registry publishing.
  pypi:
    needs: build
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Set registry package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path('server/pyproject.toml').read_text())['project']['version']
          assert version == os.environ['RELEASE_TAG'][1:], 'Tag and package version differ'
          path = pathlib.Path('server/server.json')
          manifest = json.loads(path.read_text())
          manifest['version'] = version
          manifest['packages'][0]['version'] = version
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON
      - name: Install mcp-publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.8.1
          archive=mcp-publisher_linux_amd64.tar.gz
          gh release download "$tag" --repo modelcontextprotocol/registry --pattern "$archive"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $archive" | sha256sum --check
          tar -xzf "$archive" mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server/server.json 2>&1 | tee mcp-publish-response.txt

  # Releases created with GITHUB_TOKEN do not trigger release workflows.
  smithery:
    needs: [build, publish, pypi]
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
    steps:
      - name: Skip without Smithery API key
        if: ${{ env.SMITHERY_API_KEY == '' }}
        run: echo '::notice::SMITHERY_API_KEY is empty; skipping Smithery publishing.'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.SMITHERY_API_KEY != '' }}
        with:
          name: release-assets
          path: artifacts/release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SMITHERY_API_KEY != '' }}
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ env.SMITHERY_API_KEY != '' }}
        with:
          python-version: '3.12'
      - name: Install uv
        if: ${{ env.SMITHERY_API_KEY != '' }}
        run: pip install --require-hashes -r .github/requirements/uv.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ env.SMITHERY_API_KEY != '' }}
        with:
          node-version: '22'
      - name: Build and publish Smithery bundle
        if: ${{ env.SMITHERY_API_KEY != '' }}
        run: |
          set -euo pipefail
          bundles=(artifacts/release/*.mcpb)
          if [[ ${#bundles[@]} -ne 1 || ! -f "${bundles[0]}" ]]; then
            echo 'Expected exactly one MCPB release asset' >&2
            exit 1
          fi
          bundle="$(realpath "${bundles[0]}")"
          uv run --frozen --directory server python ../build/bundle_manifest.py --smithery "$RUNNER_TEMP/revit-model-mcp-smithery.mcpb" --from "$bundle"
          npx --yes smithery@1.2.0 mcp publish "$RUNNER_TEMP/revit-model-mcp-smithery.mcpb" -n sharafutdinovdi/revit-model-mcp
