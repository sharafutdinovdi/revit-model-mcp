name: CI

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install MCPB CLI
        run: npm install --prefix "$RUNNER_TEMP/mcpb" --no-save @anthropic-ai/mcpb@2.1.2
      - name: Validate and pack Claude Desktop bundle
        run: |
          "$RUNNER_TEMP/mcpb/node_modules/.bin/mcpb" validate bundle/manifest.json
          "$RUNNER_TEMP/mcpb/node_modules/.bin/mcpb" pack bundle "$RUNNER_TEMP/revit-model-mcp.mcpb"
      - name: Verify bundle configuration
        run: |
          node --input-type=module <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';

          const { getMcpConfigForManifest } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/mcpb/node_modules/@anthropic-ai/mcpb/dist/shared/config.js`));
          const manifest = JSON.parse(readFileSync('bundle/manifest.json', 'utf8'));
          const documentedTools = [...readFileSync('docs/tools.md', 'utf8').matchAll(/^\| `(revit_\w+)`/gm)].map(match => match[1]).sort();
          assert.deepEqual(manifest.tools.map(tool => tool.name).sort(), documentedTools);
          assert.equal(manifest.version, '0.0.0');
          assert.equal(manifest.user_config.REVIT_MCP_REDACT_PATHS.default, true);
          assert.equal(manifest.user_config.REVIT_MCP_READ_ONLY.default, false);
          assert.equal(manifest.user_config.REVIT_MCP_TOKEN.sensitive, true);
          for (const userConfig of [{}, ...[true, false].flatMap(redact => [true, false].map(readOnly => ({
            REVIT_MCP_REDACT_PATHS: redact, REVIT_MCP_READ_ONLY: readOnly,
            REVIT_MCP_HOST: 'ssh:test-workstation', REVIT_MCP_TOKEN: 'test-token',
          })))]) {
            const config = await getMcpConfigForManifest({manifest, userConfig, extensionPath: '/tmp/bundle', systemDirs: {}, pathSeparator: '/'});
            assert.equal(config.command, 'uvx');
            assert.deepEqual(config.args, ['revit-model-mcp==0.0.0']);
            const expected = {
              REVIT_MCP_REDACT_PATHS: String(userConfig.REVIT_MCP_REDACT_PATHS ?? true),
              REVIT_MCP_READ_ONLY: String(userConfig.REVIT_MCP_READ_ONLY ?? false),
              REVIT_MCP_HOST: userConfig.REVIT_MCP_HOST ?? 'local',
              REVIT_MCP_TOKEN: userConfig.REVIT_MCP_TOKEN ?? '',
            };
            assert.deepEqual(config.env, expected);
          }
          console.log('PASS: 18 documented tools, default settings, all boolean combinations and host/token forwarding');
          JAVASCRIPT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle
          path: ${{ runner.temp }}/revit-model-mcp.mcpb
          if-no-files-found: error

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Revit 2026
        run: dotnet build src/RevitModelMcp.Addin -c Release.R26 -p:DeployAddin=false
      - name: Build Revit 2022
        run: dotnet build src/RevitModelMcp.Addin -c Release.R22 -p:DeployAddin=false
      - name: Build Revit 2027
        run: dotnet build src/RevitModelMcp.Addin -c Release.R27 -p:DeployAddin=false
      - name: Test core
        run: dotnet test --project tests/RevitModelMcp.Core.Tests/RevitModelMcp.Core.Tests.csproj
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Test server
        working-directory: server
        run: uv run --with pytest pytest -q
      - name: Build installers
        shell: pwsh
        env:
          Build__Version: 0.0.0-ci
        run: |
          dotnet run --project build -- pack --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $installers = @(Get-ChildItem output/*.msi)
          if ($installers.Count -ne 2) { throw "Expected two MSIs, found $($installers.Count)" }
          $installers | ForEach-Object { Write-Host "MSI: $($_.Name) ($($_.Length) bytes)" }
      - name: Verify MSI contents
        shell: pwsh
        run: |
          foreach ($msi in Get-ChildItem output/*.msi) {
            $target = Join-Path $env:RUNNER_TEMP "extract-$($msi.BaseName)"
            $log = Join-Path $env:RUNNER_TEMP "$($msi.BaseName)-extract.log"
            $process = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn /norestart TARGETDIR=`"$target`" /l*v `"$log`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "MSI extraction failed: $($process.ExitCode)" }
            $files = @(Get-ChildItem $target -Recurse -File)
            if ($files | Where-Object Name -Like 'RevitAPI*.dll') { throw 'Revit API binaries must not be distributed' }
            $manifests = @($files | Where-Object Name -EQ 'RevitModelMcp.addin')
            if ($manifests.Count -ne 3) { throw 'Unexpected Revit year count in MSI' }
            foreach ($year in '22', '26', '27') {
              $manifest = @($manifests | Where-Object { $_.Directory.Name -eq "20$year" })
              if ($manifest.Count -ne 1) { throw "Missing or duplicate R$year manifest in MSI" }
              if (!(Test-Path "$($manifest[0].DirectoryName)/RevitModelMcp/RevitModelMcp.dll")) { throw "Missing R$year assembly in MSI" }
              Write-Host "ASSERT: $($msi.Name) contains R$year manifest and assembly"
            }
            Write-Host "ASSERT: $($msi.Name) contains no RevitAPI DLLs"
          }
      - name: Smoke test single-user MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem output/*-SingleUser.msi).FullName
          $roots = @("$env:APPDATA/Autodesk/Revit/Addins/2022", "$env:APPDATA/Autodesk/Revit/Addins/2026", "$env:APPDATA/Autodesk/Revit/Addins/2027")
          $log = "$env:RUNNER_TEMP/mcp-single-install.log"
          try {
            $process = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "SingleUser install failed: $($process.ExitCode)" }
            Write-Host 'ASSERT: SingleUser install exit code 0'
            foreach ($root in $roots) {
              foreach ($relative in 'RevitModelMcp.addin', 'RevitModelMcp/RevitModelMcp.dll') {
                if (!(Test-Path "$root/$relative")) { throw "Missing installed file: $root/$relative" }
                Write-Host "ASSERT: installed $root/$relative"
              }
            }
          } finally {
            $process = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /l*v `"$env:RUNNER_TEMP/mcp-single-uninstall.log`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "SingleUser uninstall failed: $($process.ExitCode)" }
            Write-Host 'ASSERT: SingleUser uninstall exit code 0'
          }
          foreach ($root in $roots) {
            foreach ($relative in 'RevitModelMcp.addin', 'RevitModelMcp/RevitModelMcp.dll') {
              if (Test-Path "$root/$relative") { throw "File remains after uninstall: $root/$relative" }
              Write-Host "ASSERT: removed $root/$relative"
            }
          }
      - name: Smoke test multi-user MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem output/*-MultiUser.msi).FullName
          $roots = @("$env:ProgramData/Autodesk/Revit/Addins/2022", "$env:ProgramData/Autodesk/Revit/Addins/2026", "$env:ProgramFiles/Autodesk/Revit/Addins/2027")
          $log = "$env:RUNNER_TEMP/mcp-multi-install.log"
          try {
            $process = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "MultiUser install failed: $($process.ExitCode)" }
            Write-Host 'ASSERT: MultiUser install exit code 0'
            foreach ($root in $roots) {
              foreach ($relative in 'RevitModelMcp.addin', 'RevitModelMcp/RevitModelMcp.dll') {
                if (!(Test-Path "$root/$relative")) { throw "Missing installed file: $root/$relative" }
                Write-Host "ASSERT: installed $root/$relative"
              }
            }
          } finally {
            $process = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /l*v `"$env:RUNNER_TEMP/mcp-multi-uninstall.log`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "MultiUser uninstall failed: $($process.ExitCode)" }
            Write-Host 'ASSERT: MultiUser uninstall exit code 0'
          }
          foreach ($root in $roots) {
            foreach ($relative in 'RevitModelMcp.addin', 'RevitModelMcp/RevitModelMcp.dll') {
              if (Test-Path "$root/$relative") { throw "File remains after uninstall: $root/$relative" }
              Write-Host "ASSERT: removed $root/$relative"
            }
          }
      - name: Upload MSI logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs
          path: |
            ${{ runner.temp }}/mcp-*.log
            ${{ runner.temp }}/*-extract.log
      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: output/*.msi
          if-no-files-found: error
      - name: Verify WinGet manifest generation
        shell: pwsh
        run: |
          ./build/winget/New-WingetManifests.ps1 -Version 0.0.0-ci -ReleaseTag v0.0.0-ci -OutputDir artifacts/winget -SkipDownload
          winget --version
          $output = winget validate --manifest artifacts/winget --disable-interactivity 2>&1 | Out-String
          Write-Host $output
          # winget exits non-zero for "succeeded with warnings"; only a hard failure must fail the job.
          if ($output -notmatch 'Manifest validation succeeded') { throw 'WinGet validation failed' }
          # The pwsh shell wrapper exits with the last native exit code; reset it after the check above.
          $global:LASTEXITCODE = 0
      - name: Stage add-in artifacts
        shell: pwsh
        run: |
          foreach ($year in '22', '26', '27') {
            $stage = "artifacts/addin-R$year"
            New-Item -ItemType Directory -Force "$stage/RevitModelMcp" | Out-Null
            Copy-Item "src/RevitModelMcp.Addin/bin/Release.R$year/*" "$stage/RevitModelMcp" -Recurse
            Copy-Item src/RevitModelMcp.Addin/RevitModelMcp.addin, LICENSE, THIRD-PARTY-NOTICES.md $stage
            if (!(Test-Path "$stage/RevitModelMcp/RevitModelMcp.dll")) { throw "Missing R$year add-in" }
            if (Get-ChildItem $stage -Recurse -Filter 'RevitAPI*.dll') { throw 'Revit API binaries must not be distributed' }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: revit-model-mcp-addin-R22
          retention-days: 90
          path: artifacts/addin-R22/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: revit-model-mcp-addin-R26
          retention-days: 90
          path: artifacts/addin-R26/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: revit-model-mcp-addin-R27
          retention-days: 90
          path: artifacts/addin-R27/
          if-no-files-found: error
      - name: Build Python package
        working-directory: server
        run: |
          uv build
          if ($LASTEXITCODE -ne 0) { throw 'Python build failed' }
          uvx twine check dist/*
