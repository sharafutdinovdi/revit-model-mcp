# Releases ship on Mondays (Europe/Moscow). This check passes at once for every pull request
# except the release-please one, which passes only on Monday or with the hotfix-release label.
# The schedule reruns the check for the open release PR just after Monday starts and again
# when it ends, so the status never goes stale.
name: Release window

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '5 21 * * 0,1'

permissions:
  contents: read

jobs:
  release-window:
    if: github.event_name == 'pull_request'
    name: release-window
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check the release window
        run: |
          if [ "$HEAD_REF" != "release-please--branches--main" ] || [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo "Not the release pull request, nothing to check."
            exit 0
          fi
          weekday="$(TZ=Europe/Moscow date +%u)"
          if [ "$weekday" = "1" ]; then
            echo "It is Monday in Europe/Moscow, the release window is open."
            exit 0
          fi
          if gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -qx 'hotfix-release'; then
            echo "The hotfix-release label overrides the release window."
            exit 0
          fi
          echo "::error::Releases ship on Mondays (Europe/Moscow). Wait for Monday or add the hotfix-release label for an urgent fix."
          exit 1

  rerun-release-pr:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Rerun the check for the open release pull request
        run: |
          head_sha="$(gh pr list --head release-please--branches--main --state open --json headRefOid --jq '.[0].headRefOid // empty')"
          if [ -z "$head_sha" ]; then
            echo "No open release pull request."
            exit 0
          fi
          run_id="$(gh run list --workflow release-window.yml --event pull_request --commit "$head_sha" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::warning::No release-window run found for $head_sha."
            exit 0
          fi
          gh run rerun "$run_id"
