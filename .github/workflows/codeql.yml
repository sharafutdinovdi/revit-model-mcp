name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-latest
            build-mode: manual
          - language: python
            os: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Restore Revit API reference pin helper with lock
        if: matrix.language == 'csharp'
        run: dotnet restore build/RevitApiReferencePin/RevitApiReferencePin.csproj --locked-mode -p:Configuration=Release
      - name: Restore Revit 2026 with lock
        if: matrix.language == 'csharp'
        run: dotnet restore src/RevitModelMcp.Addin/RevitModelMcp.Addin.csproj --locked-mode -p:Configuration=Release.R26 -p:DeployAddin=false
      - name: Build Revit 2026
        if: matrix.language == 'csharp'
        run: dotnet build src/RevitModelMcp.Addin -c Release.R26 -p:DeployAddin=false --no-restore
      - name: Restore Revit 2022 with lock
        if: matrix.language == 'csharp'
        run: dotnet restore src/RevitModelMcp.Addin/RevitModelMcp.Addin.csproj --locked-mode -p:Configuration=Release.R22 -p:DeployAddin=false
      - name: Build Revit 2022
        if: matrix.language == 'csharp'
        run: dotnet build src/RevitModelMcp.Addin -c Release.R22 -p:DeployAddin=false --no-restore
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
