name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            os: windows-latest
            build-mode: manual
          - language: python
            os: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Revit 2026
        if: matrix.language == 'csharp'
        run: dotnet build src/RevitModelMcp.Addin -c Release.R26 -p:DeployAddin=false
      - name: Build Revit 2022
        if: matrix.language == 'csharp'
        run: dotnet build src/RevitModelMcp.Addin -c Release.R22 -p:DeployAddin=false
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
