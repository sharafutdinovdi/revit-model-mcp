name: Store

on:
  push:
    branches: ['store/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install --require-hashes -r .github/requirements/uv.txt
      - name: Test server
        working-directory: server
        run: |
          uv sync --frozen
          uv run --frozen --with pytest==9.1.1 pytest -q
      - name: Test Core channels
        shell: pwsh
        run: |
          foreach ($channel in 'github', 'store') {
            dotnet test --project tests/RevitModelMcp.Core.Tests/RevitModelMcp.Core.Tests.csproj "-p:Channel=$channel"
            if ($LASTEXITCODE -ne 0) { throw "$channel Core tests failed" }
          }
      - name: Restore build tools
        shell: pwsh
        run: |
          dotnet restore build/Build.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Build project restore failed' }
          dotnet restore build/RevitApiReferencePin/RevitApiReferencePin.csproj --locked-mode -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw 'Reference pin helper restore failed' }
      - name: Build store server
        shell: pwsh
        run: |
          python build/server-exe/build.py --channel store
          if ($LASTEXITCODE -ne 0) { throw 'Store server build failed' }
          python build/server-exe/smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Store server smoke failed' }
      - name: Build store bundle for Revit 2022-2027
        shell: pwsh
        env:
          Bundle__Store: 'true'
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('server/pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Version read failed' }
          "STORE_VERSION=$version" >> $env:GITHUB_ENV
          $env:Build__Version = $version
          foreach ($year in '22', '23', '24', '25', '26', '27') {
            dotnet restore src/RevitModelMcp.Addin/RevitModelMcp.Addin.csproj --locked-mode "-p:Configuration=Release.R$year" -p:Channel=store -p:DeployAddin=false
            if ($LASTEXITCODE -ne 0) { throw "R$year store restore failed" }
            dotnet build src/RevitModelMcp.Addin -c "Release.R$year" -p:Channel=store -p:DeployAddin=false --no-restore -m:1 -nr:false
            if ($LASTEXITCODE -ne 0) { throw "R$year store build failed" }
          }
          dotnet run --no-restore --project build -- bundle
          if ($LASTEXITCODE -ne 0) { throw 'Store bundle failed' }
          python build/validate_bundle.py "output/revit-model-mcp-$version-store.bundle.zip" --years 2022-2027 --store
          if ($LASTEXITCODE -ne 0) { throw 'Store bundle validation failed' }
      - name: Export and check store manifest
        shell: pwsh
        run: |
          $manifest = "output/revit-model-mcp-$env:STORE_VERSION-store.mcp-manifest.json"
          uv run --frozen --directory server python ../build/tool_manifest.py --managed --export-snake-case "../$manifest"
          if ($LASTEXITCODE -ne 0) { throw 'Store manifest export failed' }
          output/server-exe/venv/Scripts/python.exe build/store_check.py "output/revit-model-mcp-$env:STORE_VERSION-store.bundle.zip" --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Store checks failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-1.0.0
          path: |
            output/*-store.bundle.zip
            output/*-store.mcp-manifest.json
          if-no-files-found: error
