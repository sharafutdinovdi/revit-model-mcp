name: Welcome contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ github.token }}
          issue_message: >-
            Thanks for the report! Please check [CONTRIBUTING](https://github.com/sharafutdinovdi/revit-model-mcp/blob/main/CONTRIBUTING.md)
            for reproduction details and screenshots that help us investigate.
          pr_message: >-
            Thanks for your first PR! Please follow [CONTRIBUTING](https://github.com/sharafutdinovdi/revit-model-mcp/blob/main/CONTRIBUTING.md)
            and complete the PR checklist, including a screenshot or recording for UI or ribbon changes.
