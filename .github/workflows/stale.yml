name: Close inactive issues and PRs

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: pinned,bug
          exempt-pr-labels: pinned,bug
          stale-issue-message: This issue has had no activity for 60 days. Add an update to keep it open; otherwise it closes in 14 days.
          stale-pr-message: This PR has had no activity for 60 days. Add an update to keep it open; otherwise it closes in 14 days.
          close-issue-message: Closed after 14 days without an update. Reopen with current reproduction details if the problem remains.
          close-pr-message: Closed after 14 days without an update. Reopen when the change is ready to continue.
