name: Community

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '30 1 * * *'

permissions:
  contents: read

jobs:
  community:
    permissions:
      contents: read
      issues: write
      pull-requests: write
