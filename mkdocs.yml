  - Guides:
      - "Connect Claude to Revit": guides/connect-claude-to-revit.md
      - "Connect ChatGPT, Codex, Cursor or VS Code to Revit": guides/connect-chatgpt-codex-cursor-vscode-to-revit.md
      - "Revit MCP servers compared": guides/revit-mcp-servers-compared.md
      - "AI model coordination in Revit": guides/ai-model-coordination-in-revit.md
      - "Build a BIM model in Revit with AI": guides/build-bim-model-in-revit-with-ai.md
      - "Is it safe? Read-only, Undo and privacy": guides/safety.md
      - FAQ: guides/faq.md
  - Setup and concepts:
      - Install with an AI agent: agent-install.md
      - Requirements and install: install.md
      - Server: server.md
      - How it works: how-it-works.md
      - Transport: transport.md
      - Batch: batch.md
      - Model audit: model-audit.md
      - Security: security.md
      - Architecture: architecture.md
      - Automatic updates: updates.md
  - Administrators:
      - Deployment: admin/deployment.md
      - Policy reference: admin/policy-reference.md
      - Security whitepaper: admin/security-whitepaper.md
      - Security questionnaire: admin/security-questionnaire.md
  - Design:
      - Model audit: design/model-audit.md
  - Reference:
      - Tools: tools.md
      - Stability: stability.md
      - Tool manifest: tool-manifest.md
      - Prompts and coordinator guide: prompts.md
      - Actions: actions.md
      - Validation: validation.md
      - Performance: performance.md
      - Feed format: feed-format.md
      - MCP specifications: mcp-specifications.md
      - Tested clients: tested-clients.md
      - What it does not do: not-doing.md
      - Roadmap: roadmap.md
